<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="sans-serif" font-size="14">
  <title>Prefill rate on this recipe</title>

  <rect x="0" y="0" width="1000" height="380" fill="#111111"/>

  <text x="20" y="30" font-size="14" fill="#e6e6e6">Prefill rate, tokens per second</text>
  <text x="20" y="50" font-size="13" fill="#a0a0a0">GB10 + RTX 3090, KV 14 GiB, one prefill job per size.</text>

  <line x1="300" y1="70" x2="300" y2="290" stroke="#555555" stroke-width="1"/>
  <line x1="300" y1="290" x2="960" y2="290" stroke="#555555" stroke-width="1"/>
  <line x1="465" y1="70" x2="465" y2="290" stroke="#333333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="630" y1="70" x2="630" y2="290" stroke="#333333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="795" y1="70" x2="795" y2="290" stroke="#333333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="310" font-size="12" text-anchor="middle" fill="#a0a0a0">0</text>
  <text x="465" y="310" font-size="12" text-anchor="middle" fill="#a0a0a0">1000</text>
  <text x="630" y="310" font-size="12" text-anchor="middle" fill="#a0a0a0">2000</text>
  <text x="795" y="310" font-size="12" text-anchor="middle" fill="#a0a0a0">3000</text>
  <text x="960" y="310" font-size="12" text-anchor="middle" fill="#a0a0a0">4000</text>

  <text x="290" y="96" font-size="13" text-anchor="end" fill="#e6e6e6">4K</text>
  <rect x="300" y="84" width="464" height="24" rx="3" fill="#6ea8fe"/>
  <text x="756" y="102" font-size="13" text-anchor="end" fill="#111111">2814.48</text>

  <text x="290" y="132" font-size="13" text-anchor="end" fill="#e6e6e6">16K</text>
  <rect x="300" y="120" width="445" height="24" rx="3" fill="#6ea8fe" opacity="0.8"/>
  <text x="737" y="138" font-size="13" text-anchor="end" fill="#111111">2698.71</text>

  <text x="290" y="168" font-size="13" text-anchor="end" fill="#e6e6e6">32K</text>
  <rect x="300" y="156" width="433" height="24" rx="3" fill="#6ea8fe" opacity="0.6"/>
  <text x="725" y="174" font-size="13" text-anchor="end" fill="#111111">2621.51</text>

  <text x="20" y="350" font-size="13" fill="#a0a0a0">GB10-alone prefill was not measured for this recipe, and the reference repository publishes no prefill figure, so there is no second series to compare.</text>
</svg>
